[project]
name = "bili-subtitle-mcp"
version = "0.1.0"
description = "Bilibili video MCP server: video info, hot comments, and subtitles for AI clients (no API key required)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0,<2.0",
    "httpx>=0.27",
]

[project.scripts]
bili-subtitle-mcp = "bili_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bili_mcp"]
